# Uruchomienie: docker compose up --build   →  UI + API: http://localhost:4000
# Wszystkie komponenty lokalnie (bez chmury publicznej). Opcjonalny lokalny model AI: docker compose --profile ai up
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: olcys
      POSTGRES_USER: olcys
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-olcys-dev-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olcys -d olcys"]
      interval: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://olcys:${POSTGRES_PASSWORD:-olcys-dev-only}@db:5432/olcys
      SEARXNG_URL: ${SEARXNG_URL:-http://searxng:8080}
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
      OLCYS_WEB_FETCH: ${OLCYS_WEB_FETCH:-public}
      OLCYS_MAX_DEPTH: ${OLCYS_MAX_DEPTH:-}
      OLCYS_SEARCH_RESULTS: ${OLCYS_SEARCH_RESULTS:-}
      OLCYS_LIVE_RATES: ${OLCYS_LIVE_RATES:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OLCYS_REDDIT: ${OLCYS_REDDIT:-true}
      REDDIT_CLIENT_ID: ${REDDIT_CLIENT_ID:-}
      REDDIT_CLIENT_SECRET: ${REDDIT_CLIENT_SECRET:-}
      BLOCKSCOUT_URL: ${BLOCKSCOUT_URL:-https://eth.blockscout.com}
      ETHERSCAN_API_KEY: ${ETHERSCAN_API_KEY:-}
      EVM_NETWORKS: ${EVM_NETWORKS:-polygon,arbitrum}
      ETH_RPC_URL: ${ETH_RPC_URL:-}
      ESPLORA_URL: ${ESPLORA_URL:-https://blockstream.info/api}
      TRONGRID_URL: ${TRONGRID_URL:-https://api.trongrid.io}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      # pieczęć pakietu dowodowego: znacznik czasu RFC 3161 (pusty = wyłączony); konta analityków: data/users.json
      OLCYS_TSA_URL: ${OLCYS_TSA_URL-http://time.certum.pl}
      OLCYS_SESSION_SECRET: ${OLCYS_SESSION_SECRET:-}
      # tryb offline (nagranie montowane z ./data/recordings)
      OLCYS_RECORD_DIR: ${OLCYS_RECORD_DIR:-}
      OLCYS_REPLAY_DIR: ${OLCYS_REPLAY_DIR:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    # nagrania trybu offline i archiwum dziennych cen krypto (przetrwa przebudowę kontenera)
    volumes: ["./data/recordings:/app/data/recordings", "./data/prices:/app/data/prices", "./data/keys:/app/data/keys"]
    ports: ["4000:4000"]
    depends_on:
      db: { condition: service_healthy }
      searxng: { condition: service_started }

  searxng:
    # wersja przypięta (odtwarzalność, kontrola łańcucha dostaw) – aktualizacja świadomą decyzją
    image: searxng/searxng:2026.10.30-ffa88e3ba
    volumes: ["./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    environment:
      SEARXNG_BASE_URL: "http://searxng:8080/"
      SEARXNG_SECRET: ${SEARXNG_SECRET:-olcys-change-me-in-production}
    ports: ["8888:8080"]
    restart: unless-stopped

  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.5.7
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  pgdata:
  ollama:
